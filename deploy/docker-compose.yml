# Opción B — Docker Compose: relay + Caddy (TLS automático).
#   cp .env.example .env   # RP_DOMAIN=relay.midominio.com
#   docker compose up -d
#   docker compose exec relay rp-relay pair device     # QR para la app
#   docker compose exec relay rp-relay doctor
services:
  relay:
    image: ghcr.io/j3pf/rp-relay:latest
    build:
      context: ..
    restart: unless-stopped
    environment:
      RP_PUBLIC_URL: https://${RP_DOMAIN:?define RP_DOMAIN en .env}
      RP_RELAY_NAME: ${RP_RELAY_NAME:-Servidor casa}
      RP_LISTEN_HOST: 0.0.0.0
      RP_TRUST_PROXY: "true"          # detrás de Caddy: IP real del cliente para los límites de tasa
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # FCM es opcional. Para activarlo: monta la cuenta de servicio y descomenta
      # RP_FCM_SERVICE_ACCOUNT_FILE: /etc/rp-relay/firebase-sa.json
    volumes:
      - rp-data:/var/lib/rp-relay
      # - ./firebase-sa.json:/etc/rp-relay/firebase-sa.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RP_DOMAIN: ${RP_DOMAIN}
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  rp-data:
  caddy-data:
  caddy-config:
