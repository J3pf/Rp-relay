name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: La etiqueta coincide con las versiones de los paquetes
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in package.json packages/protocol/package.json; do
            v=$(node -p "require('./$p').version")
            [ "$v" = "$tag" ] || { echo "$p tiene versión $v, la etiqueta es $tag"; exit 1; }
          done
      # Las notas curadas son la cara del release; sin ellas la página muestra ruido de commits.
      # Se valida aquí y no en `github-release` para que un tag sin notas no publique ni la imagen.
      - name: Las notas curadas del release existen
        run: |
          notes="docs/RELEASE-NOTES-${GITHUB_REF_NAME#v}.md"
          [ -f "$notes" ] || { echo "falta $notes: el release publica docs/RELEASE-NOTES-<versión>.md"; exit 1; }
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  npm:
    # Publicación en npm DIFERIDA: no hay credenciales todavía. Sólo corre si se define
    # la variable de repositorio RP_PUBLISH_NPM=true y el secreto NPM_TOKEN existe.
    # El GitHub Release no depende de este job (ver test/release-workflow.test.ts).
    if: ${{ vars.RP_PUBLISH_NPM == 'true' }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      # el protocolo primero: el relay depende de él
      - run: npm publish -w packages/protocol --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/j3pf/rp-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    # La entrega actual es la imagen de ghcr + este release, con el tarball que consume
    # deploy/install.sh (`npm install -g <tgz>`). No espera al job de npm.
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # `bundledDependencies` incluye @j3pf/rp-protocol, que no está publicado: sin él `npm i -g` da 404.
      - run: npm pack
      # El artefacto que se adjunta tiene que ser el artefacto que se probó: instalar y exigir la versión de la etiqueta.
      - name: El tarball se instala y responde con la versión de la etiqueta
        run: |
          npm install -g --prefix "$RUNNER_TEMP/rp-install" ./j3pf-rp-relay-*.tgz
          "$RUNNER_TEMP/rp-install/bin/rp-relay" --version | grep -qx "${GITHUB_REF_NAME#v}"
      # `with:` no ejecuta shell, así que la ruta de las notas se resuelve en un paso previo: el
      # archivo es por etiqueta (`docs/RELEASE-NOTES-0.6.1.md`), no uno fijo.
      - id: notes
        name: Resuelve las notas curadas del release
        run: echo "path=docs/RELEASE-NOTES-${GITHUB_REF_NAME#v}.md" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          # `body_path` y `generate_release_notes` son excluyentes en la práctica: dejar la segunda en
          # `true` reemplazaba las notas curadas por «What's Changed…» y el archivo se ignoraba.
          body_path: ${{ steps.notes.outputs.path }}
          files: j3pf-rp-relay-*.tgz
